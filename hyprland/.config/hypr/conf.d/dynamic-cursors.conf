# hypr-dynamic-cursors
# Built locally against the running Hyprland ABI.
plugin = /home/pwcca/.local/share/hyprplugins/hypr-dynamic-cursors/out/dynamic-cursors.so

plugin:dynamic-cursors {
    enabled = true

    # Keep normal cursor behavior; only enlarge it when shaken.
    mode = none

    shake {
        enabled = true
        threshold = 4.0
        base = 2.5
        speed = 2.0
        influence = 0.0
        limit = 3.5
        timeout = 1200
        effects = false
    }

    hyprcursor {
        enabled = false
        nearest = false
        fallback = clientside
    }
}
